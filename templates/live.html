<!DOCTYPE html>
<html>

<head>

    <title>Live Face Recognition</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

   
   



</head>

<body>

{% include "navbar.html" %}

<div class="container mt-5">

    <h2 class="text-center mb-4">
        🎥 Live Face Recognition
    </h2>

    <div class="text-center">

        <video
            id="video"
            width="700"
            height="480"
            autoplay
            playsinline
            muted
            style="border:5px solid green;border-radius:10px;">
        </video>

        <div id="status" class="mt-3">

            <div class="alert alert-info">
                📷 Starting camera...
            </div>

        </div>

        <canvas
            id="canvas"
            width="700"
            height="480"
            style="display:none;">
        </canvas>

    </div>

</div>


<title>Live Face Recognition</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

<script
    src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
</script>

{% include "navbar.html" %}

<h2 class="text-center mb-4">
    🎥 Live Face Recognition
</h2>

<div class="text-center">

    <video
        id="video"
        width="700"
        height="480"
        autoplay
        playsinline
        muted
        style="border:5px solid green;border-radius:10px;">
    </video>

    <div id="status" class="mt-3">

        <div class="alert alert-info">
            ⏳ Loading face recognition...
        </div>

    </div>

</div>


<script>
    let video = document.getElementById("video");
    let status = document.getElementById("status");
    
    let recognitionRunning = false;
    let registeredFaces = [];
    
    
    async function loadModels() {
    
        try {
    
            status.innerHTML = `
                <div class="alert alert-info">
                    ⏳ Loading face recognition models...
                </div>
            `;
    
            await faceapi.nets.tinyFaceDetector.loadFromUri(
                "/static/models"
            );
    
            await faceapi.nets.faceLandmark68Net.loadFromUri(
                "/static/models"
            );
    
            await faceapi.nets.faceRecognitionNet.loadFromUri(
                "/static/models"
            );
    
            console.log("✅ Face API models loaded");
    
            // Get registered employee face descriptors
            const response = await fetch("/face_descriptors");
    
            if (!response.ok) {
                throw new Error(
                    "Failed to load registered faces: " + response.status
                );
            }
    
            registeredFaces = await response.json();
    
            console.log(
                "Registered faces:",
                registeredFaces
            );
    
            status.innerHTML = `
                <div class="alert alert-success">
                    ✅ Models loaded successfully.
                    <br>
                    📷 Starting camera...
                </div>
            `;
    
            startCamera();
    
        } catch (error) {
    
            console.error("Model error:", error);
    
            status.innerHTML = `
                <div class="alert alert-danger">
                    ❌ ${error}
                </div>
            `;
        }
    }
    
    
    async function startCamera() {
    
        try {
    
            const stream =
                await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
    
            video.srcObject = stream;
    
            await video.play();
    
            status.innerHTML = `
                <div class="alert alert-success">
                    🟢 Camera started.
                    <br>
                    👤 Looking for face...
                </div>
            `;
    
            recognitionRunning = true;
    
            setTimeout(() => {
                recognizeFace();
            }, 2000);
    
        } catch (error) {
    
            console.error("Camera error:", error);
    
            status.innerHTML = `
                <div class="alert alert-danger">
                    ❌ Camera could not be started.
                    <br>
                    ${error}
                </div>
            `;
        }
    }
    
    
    async function recognizeFace() {
    
        if (!recognitionRunning) {
            return;
        }
    
        try {
    
            if (!video.videoWidth) {
                setTimeout(recognizeFace, 2000);
                return;
            }
    
            const detection =
                await faceapi
                    .detectSingleFace(
                        video,
                        new faceapi.TinyFaceDetectorOptions({
                            inputSize: 320,
                            scoreThreshold: 0.5
                        })
                    )
                    .withFaceLandmarks()
                    .withFaceDescriptor();
    
    
            if (!detection) {
    
                status.innerHTML = `
                    <div class="alert alert-warning">
                        👤 No face detected.
                    </div>
                `;
    
                setTimeout(recognizeFace, 2000);
                return;
            }
    
    
            console.log("✅ Face detected");
    
    
            const descriptor =
                Array.from(detection.descriptor);
    
    
            // Send descriptor to Flask
            const response = await fetch(
                "/recognize_face",
                {
                    method: "POST",
    
                    headers: {
                        "Content-Type": "application/json"
                    },
    
                    body: JSON.stringify({
                        descriptor: descriptor
                    })
                }
            );
    
    
            const result = await response.json();
    
    
            console.log(
                "Recognition result:",
                result
            );
    
    
            if (result.success) {
    
                if (result.already) {
    
                    status.innerHTML = `
                        <div class="alert alert-warning">
    
                            ⚠️ Attendance Already Marked
    
                            <br><br>
    
                            👤 Employee ID:
                            <strong>
                                ${result.emp_id}
                            </strong>
    
                            <br>
    
                            🧑 Name:
                            <strong>
                                ${result.name}
                            </strong>
    
                            <br>
    
                            🏢 Department:
                            <strong>
                                ${result.department}
                            </strong>
    
                            <br>
    
                            🕐 Time:
                            <strong>
                                ${result.time}
                            </strong>
    
                        </div>
                    `;
    
                } else {
    
                    status.innerHTML = `
                        <div class="alert alert-success">
    
                            ✅ Face Matched Successfully!
    
                            <br><br>
    
                            👤 Employee ID:
                            <strong>
                                ${result.emp_id}
                            </strong>
    
                            <br>
    
                            🧑 Name:
                            <strong>
                                ${result.name}
                            </strong>
    
                            <br>
    
                            🏢 Department:
                            <strong>
                                ${result.department}
                            </strong>
    
                            <br>
    
                            🕐 Time:
                            <strong>
                                ${result.time}
                            </strong>
    
                            <br><br>
    
                            🎉 Attendance Marked Successfully
    
                        </div>
                    `;
                }
    
    
                // Stop recognition after successful match
                recognitionRunning = false;
    
            } else {
    
                status.innerHTML = `
                    <div class="alert alert-danger">
                        ❌ Face not recognized.
                    </div>
                `;
    
                setTimeout(recognizeFace, 2000);
            }
    
    
        } catch (error) {
    
            console.error(
                "Recognition error:",
                error
            );
    
            status.innerHTML = `
                <div class="alert alert-danger">
                    ❌ Recognition error:
                    ${error.message}
                </div>
            `;
    
            setTimeout(recognizeFace, 3000);
        }
    }
    
    
    window.addEventListener(
        "load",
        function() {
            loadModels();
        }
    );
</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>



</body>

</html>
