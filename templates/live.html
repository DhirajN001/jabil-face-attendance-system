<!DOCTYPE html>
<html>

<head>

    <title>Live Face Recognition</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

   
   



</head>

<body>

{% include "navbar.html" %}

<div class="container mt-5">

    <h2 class="text-center mb-4">
        🎥 Live Face Recognition
    </h2>

    <div class="text-center">

        <video
            id="video"
            width="700"
            height="480"
            autoplay
            playsinline
            muted
            style="border:5px solid green;border-radius:10px;">
        </video>

        <div id="status" class="mt-3">

            <div class="alert alert-info">
                📷 Starting camera...
            </div>

        </div>

        <canvas
            id="canvas"
            width="700"
            height="480"
            style="display:none;">
        </canvas>

    </div>

</div>


<script>

    let video = document.getElementById("video");
    let status = document.getElementById("status");
    
    let recognitionRunning = false;
    let lastRecognition = "";
    
    
    async function startCamera() {
    
        try {
    
            const stream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });
    
            video.srcObject = stream;
    
            status.innerHTML = `
                <div class="alert alert-success">
                    🟢 Camera started successfully.
                    <br>
                    👤 Looking for face...
                </div>
            `;
    
            recognitionRunning = true;
    
            startRecognition();
    
        } catch (error) {
    
            console.error("Camera error:", error);
    
            status.innerHTML = `
                <div class="alert alert-danger">
                    ❌ Camera could not be started.
                    <br>
                    ${error}
                </div>
            `;
    
        }
    }
    
    
    // ===============================
    // FACE RECOGNITION
    // ===============================
    
    async function recognizeFace() {
    
        if (!recognitionRunning) {
            return;
        }
    
        if (!video.videoWidth || !video.videoHeight) {
            return;
        }
    
        try {
    
            const canvas = document.getElementById("canvas");
    
            const context = canvas.getContext("2d");
    
            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );
    
    
            const image = canvas.toDataURL("image/jpeg", 0.8);
    
    
            const response = await fetch("/recognize", {
    
                method: "POST",
    
                headers: {
                    "Content-Type": "application/json"
                },
    
                body: JSON.stringify({
                    image: image
                })
    
            });
    
    
            const result = await response.json();
    
            console.log("Recognition result:", result);
    
    
            if (result.success) {
    
                if (result.already) {
    
                    status.innerHTML = `
                        <div class="alert alert-warning">
    
                            ⚠️ Attendance Already Marked
    
                            <br><br>
    
                            👤 Employee ID:
                            <strong>${result.emp_id}</strong>
    
                            <br>
    
                            🧑 Name:
                            <strong>${result.name}</strong>
    
                            <br>
    
                            🏢 Department:
                            <strong>${result.department}</strong>
    
                            <br>
    
                            🕐 Time:
                            <strong>${result.time}</strong>
    
                        </div>
                    `;
    
                } else {
    
                    status.innerHTML = `
                        <div class="alert alert-success">
    
                            ✅ Face Matched Successfully!
    
                            <br><br>
    
                            👤 Employee ID:
                            <strong>${result.emp_id}</strong>
    
                            <br>
    
                            🧑 Name:
                            <strong>${result.name}</strong>
    
                            <br>
    
                            🏢 Department:
                            <strong>${result.department}</strong>
    
                            <br>
    
                            🕐 Time:
                            <strong>${result.time}</strong>
    
                            <br><br>
    
                            🎉 Attendance Marked Successfully
    
                        </div>
                    `;
    
                }
    
                // Stop repeated recognition after successful match
                recognitionRunning = false;
    
            }
    
        } catch (error) {
    
            console.error("Recognition error:", error);
    
        }
    
    }
    
    
    // ===============================
    // RUN EVERY 5 SECONDS
    // ===============================
    
    function startRecognition() {
    
        setInterval(() => {
    
            recognizeFace();
    
        }, 5000);
    
    }
    
    
    // ===============================
    // START CAMERA WHEN PAGE LOADS
    // ===============================
    
    window.addEventListener("load", function() {
    
        startCamera();
    
    });
    
    </script>



</body>

</html>
