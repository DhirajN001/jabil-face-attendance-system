<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jabil Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">
    {% include "navbar.html" %}
    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Jabil Face Attendance Dashboard
        </h1>

        <h4 class="text-center mb-5">
            Date: {{ today }}
        </h4>

        <div class="row">

            <div class="col-md-4">

                <div class="card text-center shadow">

                    <div class="card-body">

                        <h3>Total Employees</h3>

                        <h1>{{ total_employees }}</h1>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card text-center shadow">

                    <div class="card-body">

                        <h3>Present Employees</h3>

                        <h1>{{ present_employees }}</h1>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card text-center shadow">

                    <div class="card-body">

                        <h3>Absent Employees</h3>

                        <h1>{{ absent_employees }}</h1>

                    </div>

                </div>

            </div>

        </div>

        <div class="text-center mt-5">

            <a href="/employees" class="btn btn-primary">
                Employees
            </a>

            <a href="/attendance" class="btn btn-success">
                Attendance
            </a>

            <a href="/camera" class="btn btn-danger">
                Camera
            </a>

        </div>
        <div class="row mt-5">

            <div class="col-md-6 mx-auto">
        
                <canvas id="attendanceChart"></canvas>
        
            </div>
        
        </div>
        
        </div>
        <script>

            const ctx = document.getElementById('attendanceChart');
            
            new Chart(ctx, {
            
                type: 'pie',
            
                data: {
            
                    labels: ['Present', 'Absent'],
            
                    datasets: [{
            
                        data: [
                            {{ present_employees }},
                            {{ absent_employees }}
                        ],
            
                        backgroundColor: [
                            '#28a745',
                            '#dc3545'
                        ]
            
                    }]
            
                }
            
            });
            
            </script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
