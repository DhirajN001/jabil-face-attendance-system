<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jabil Face Attendance Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#0f172a,#2563eb);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0;
        }
    
        .login-box{
            width:400px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,.3);
        }
    
        .profile-photo{
            width:120px;
            height:120px;
            object-fit:cover;
            border-radius:50%;
            display:block;
            margin:0 auto 15px auto;
            border:4px solid #2563eb;
        }
    
        h2{
            text-align:center;
            margin-bottom:25px;
            font-weight:bold;
        }
    
        .btn-primary{
            width:100%;
        }
    
    </style>

</head>

<body>

    <div class="login-box">

        <img
            src="{{ url_for('static', filename='profile.jpg') }}"
            class="profile-photo"
            alt="Dhiraj">
    
        <h2>Jabil Face Attendance</h2>
    
        <form action="/login" method="POST">
    
            <div class="mb-3">
    
                <label class="form-label">
                    Username
                </label>
    
                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>
    
            </div>
    
            <div class="mb-3">
    
                <label class="form-label">
                    Password
                </label>
    
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>
    
            </div>
    
            <button class="btn btn-primary">
                Login
            </button>
    
        </form>
    
</div>

</body>

</html>
