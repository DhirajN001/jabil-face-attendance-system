<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jabil Face Attendance{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .sidebar{
            width:240px;
            height:100vh;
            background:#0057B8;
            position:fixed;
            color:white;
        }

        .sidebar h3{
            text-align:center;
            padding:20px;
            font-weight:bold;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:14px 20px;
        }

        .sidebar a:hover{
            background:#003f87;
        }

        .content{
            margin-left:240px;
            padding:25px;
        }

        .navbar{
            background:white;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
            margin-bottom:20px;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 5px 12px rgba(0,0,0,.08);
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h3>JABIL</h3>

    <a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/employees"><i class="bi bi-people"></i> Employees</a>
    <a href="/camera"><i class="bi bi-camera-video"></i> Face Registration</a>
    <a href="/attendance"><i class="bi bi-check-circle"></i> Attendance</a>
    <a href="#"><i class="bi bi-file-earmark-excel"></i> Reports</a>
</div>

<div class="content">

<nav class="navbar navbar-expand-lg rounded px-3">
    <span class="navbar-brand">
        Jabil Face Attendance System
    </span>
</nav>

{% block content %}
{% endblock %}

</div>

</body>
</html>
